<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#050912"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 90) rotate(128) scale(560)">
      <stop stop-color="#4F46E5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="90" y1="96" x2="210" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- icon mark (favicon scaled ~3.75x) -->
  <g transform="translate(90 96)">
    <rect width="120" height="120" rx="28" fill="url(#mark)"/>
    <g transform="scale(3.75)">
      <path d="M11.5 7H16.5L22 12.5V24A2 2 0 0 1 20 26H10A2 2 0 0 1 8 24V9A2 2 0 0 1 10 7Z" fill="#ffffff"/>
      <path d="M16.8 7.2V11A1.4 1.4 0 0 0 18.2 12.4H22Z" fill="#C7D2FE"/>
      <rect x="11" y="14.2" width="6.4" height="1.7" rx="0.85" fill="#C7D2FE"/>
      <rect x="11" y="17.4" width="4.2" height="1.7" rx="0.85" fill="#C7D2FE"/>
      <path d="M11.4 22.1L13.6 24.3L18 19.5" fill="none" stroke="#10B981" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="228" y="150" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="0.5">PRD Reviewer</text>

  <text x="90" y="322" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-2">Write better PRDs.</text>
  <text x="90" y="386" fill="#9CA3AF" font-size="40" font-weight="500" letter-spacing="-0.5">Catch gaps before engineering does.</text>

  <!-- category pills -->
  <g transform="translate(90 470)" font-size="26" font-weight="600">
    <g>
      <rect width="176" height="56" rx="28" fill="#4F46E5" fill-opacity="0.16" stroke="#4F46E5" stroke-opacity="0.4"/>
      <text x="88" y="37" fill="#C7D2FE" text-anchor="middle">Product</text>
    </g>
    <g transform="translate(196 0)">
      <rect width="164" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="82" y="37" fill="#E5E7EB" text-anchor="middle">Design</text>
    </g>
    <g transform="translate(380 0)">
      <rect width="238" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="119" y="37" fill="#E5E7EB" text-anchor="middle">Engineering</text>
    </g>
  </g>

  <text x="1110" y="586" fill="#4B5563" font-size="24" font-weight="600" text-anchor="end">prdreviewer.netlify.app</text>
</svg>
